<style>
/* Layout: one column for a phone, tab bar at the bottom, cards only for the thing you act on. */
:root{
  /* Stijl "botanische atlas": papier, salie, olijf; oudroze voor rood/blauw, licht goud voor wit. */
  --bg:#f3f1e7; --surface:#fbfaf4; --ink:#26321f; --muted:#66735c; --line:#dfe2d1;
  --accent:#3b5220; --accent-ink:#f4f1e6; --leaf:#7f9a5a; --gold:#b3913f; --rose:#a8687b; --region:#a8687b;
  --good:#4f7a2e; --bad:#a2505f; --warn:#94701c; --water:#4f8c88;
  --good-bg:#e3ecd4; --bad-bg:#f4e1e3; --warn-bg:#f3ead2;
  --t1:#e6ecd8; --t2:#f1e3e6; --t3:#e1ebe8; --t4:#f3ead2;
  --paper:#f6f3e6;
  --display:"Fraunces",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14201a; --surface:#1c2b23; --ink:#e9eee2; --muted:#a7b59c; --line:#2d3f33;
    --accent:#a9c47f; --accent-ink:#14201a; --leaf:#a9c47f; --gold:#dcc58a; --rose:#d29aab; --region:#d29aab;
    --good:#9cc77a; --bad:#e3a3b0; --warn:#e2c27a; --water:#8fc1bd;
    --good-bg:#24392a; --bad-bg:#3b2a2f; --warn-bg:#3a3420;
    --t1:#22382a; --t2:#3a2a31; --t3:#1f3634; --t4:#37321f; --paper:#1f2f26;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14201a; --surface:#1c2b23; --ink:#e9eee2; --muted:#a7b59c; --line:#2d3f33;
  --accent:#a9c47f; --accent-ink:#14201a; --leaf:#a9c47f; --gold:#dcc58a; --rose:#d29aab; --region:#d29aab;
  --good:#9cc77a; --bad:#e3a3b0; --warn:#e2c27a; --water:#8fc1bd;
  --good-bg:#24392a; --bad-bg:#3b2a2f; --warn-bg:#3a3420;
  --t1:#22382a; --t2:#3a2a31; --t3:#1f3634; --t4:#37321f; --paper:#1f2f26;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
header h1{font-family:var(--display);font-weight:500;font-size:1.55rem;line-height:1.1;margin:0;display:flex;align-items:center;gap:8px}
header h1 svg{flex:none}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
main{max-width:640px;margin:0 auto;padding:10px 16px 104px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:500;font-size:1.25rem;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 18px;font-weight:700;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;min-height:40px;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.off{opacity:.5;border-style:dashed;cursor:default}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:52px}
.opt b{font-family:var(--display);color:var(--muted);min-width:1.1em}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right b{color:var(--good)} .opt.wrong b{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:9px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:3px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.half{background:var(--warn-bg);color:var(--warn)}
.pill.code{background:transparent;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.dim{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.week{display:flex;gap:6px}.week span{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.week i{display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:3px}.week i.on{background:var(--leaf)}
input[type=search],input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=search]{width:100%}input:focus-visible,textarea:focus-visible{outline:3px solid var(--leaf);outline-offset:1px}
#zoekres{display:flex;flex-direction:column}
.hit2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;min-height:44px;width:100%}
.hit2 span{color:var(--muted);font-size:.82rem;text-align:right}
.dag{display:flex;gap:14px;align-items:center}.dag .plate{width:84px;height:104px;flex:none}.dag>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.result .big{font-family:var(--display);font-size:2.6rem;line-height:1}.result .big span{font-size:1rem;color:var(--muted);font-family:var(--body)}
.result.pass{border-color:var(--leaf);background:var(--good-bg)}
.note{border-left:3px solid var(--leaf);padding:2px 0 2px 12px;font-size:.92rem}
.grapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.grape{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;min-height:58px;font-size:.92rem}
.grape .plate{height:46px;border-radius:6px}
.grape em{display:block;font-style:normal;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grape.w{border-left:5px solid var(--gold)} .grape.b{border-left:5px solid var(--rose)}
.plate{position:relative;display:block;background:var(--paper);overflow:hidden;border-radius:10px}
.plate svg.drawn{display:block;width:100%;height:100%;padding:6%}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.plate.loaded img{opacity:1}.plate.loaded svg.drawn{visibility:hidden}
@media (prefers-reduced-motion:no-preference){.plate img{transition:opacity .4s}}
.hero{display:grid;grid-template-columns:1fr 42%;gap:14px;align-items:start}
.hero figure{margin:0;display:flex;flex-direction:column;gap:6px}
.hero .plate{aspect-ratio:2/3}
.herotext{display:flex;flex-direction:column;gap:10px}
@media (max-width:380px){.hero{grid-template-columns:1fr}.hero .plate{max-width:240px}}
.scale{display:grid;gap:3px}
.scale span{display:flex;flex-direction:column;gap:4px;align-items:center}
.scale i{display:block;width:100%;height:10px;border-radius:3px;background:var(--line)}
.scale span.on i{background:var(--leaf)}
.scale b{font-size:.72rem;font-weight:600;color:var(--muted)}
.scale span.on b{color:var(--ink)}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.82rem;border:1px solid var(--line);color:var(--muted)}
.tag.on{background:var(--good-bg);border-color:transparent;color:var(--ink)}
.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.tasting{border-left:5px solid var(--leaf)}
.field{display:flex;flex-direction:column;gap:8px}
.res{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0;padding-top:0}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.swatch.w{background:var(--gold)} .swatch.b{background:var(--rose)}
.stat{display:flex;flex-direction:column;gap:5px}
.stat .row{font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 0;width:100%;text-align:left;min-height:46px}
.check i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.9rem;font-weight:700}
.check[aria-pressed="true"] i{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.check[aria-pressed="true"] span{color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem}
dt{color:var(--muted)} dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:transparent;border:0;border-radius:10px;padding:8px 2px;font-size:.74rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--t1);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:92px}
.tile:nth-child(2){background:var(--t2)}.tile:nth-child(3){background:var(--t3)}.tile:nth-child(4){background:var(--t4)}
.tile strong{font-family:var(--display);font-weight:500;font-size:1.15rem}
.tile span{font-size:.82rem;color:var(--muted)}
.src{font-size:.8rem;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:.86rem;text-align:left;min-height:36px}
textarea{width:100%;min-height:110px;font:inherit;font-size:.82rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.mapwrap{position:relative;overflow:hidden;border-radius:12px;background:var(--line);aspect-ratio:1/1.15;touch-action:none;user-select:none;-webkit-user-select:none}
.map{width:100%;height:100%;display:block;transform-origin:0 0}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.map text.sub{fill:var(--gold);font-style:italic}
.map .dot.soil{fill:var(--leaf)}
.map .grp text{font-weight:600}.map .grp.link{cursor:pointer}.map .grp.link text{fill:var(--accent);text-decoration:underline}
.map .grp .gw{fill:var(--gold);stroke:var(--surface);stroke-width:1px;vector-effect:non-scaling-stroke}.map .grp .gb{fill:var(--rose);stroke:var(--surface);stroke-width:1px;vector-effect:non-scaling-stroke}
.map .grp.link text,.map .grp.link circle{pointer-events:all}
/* Reliëf grijs maken, zodat bergen (bruin/rood op de topokaart) niet verward worden met de rode wijngebieden. */
.map image{filter:grayscale(.9) contrast(1.05) brightness(1.04)}
.map .reg,.map .hit{fill-rule:evenodd}
.map .reg{fill:var(--region);fill-opacity:.3;stroke:var(--region);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map .reg.kid{fill-opacity:.22;stroke-width:1.5;stroke-dasharray:5 3}
.map .reg.sel{fill-opacity:.6}
.map .lake{fill:var(--water);fill-opacity:.75;stroke:var(--water);stroke-width:1px;vector-effect:non-scaling-stroke}
.sec .fog{fill:var(--surface);opacity:.8}
.map .reg.q{fill:var(--ink);fill-opacity:.2;stroke:var(--ink)}
.map .reg.bad{fill:var(--bad);stroke:var(--bad);fill-opacity:.55}
.map .hit{fill:transparent;stroke:transparent;stroke-width:14;vector-effect:non-scaling-stroke;pointer-events:all;cursor:pointer}
.map .river{fill:none;stroke:var(--water);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.map .mount{fill:var(--leaf);fill-opacity:.28;stroke:var(--leaf);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.map .par{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:7 5;vector-effect:non-scaling-stroke}
.map .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.map text{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;pointer-events:none}
.map text.rv{fill:var(--water)} .map text.mt{fill:var(--leaf)}
.sec{width:100%;display:block;border-radius:12px;background:var(--bg)}
.sec .land{fill:var(--muted)} .sec .water{fill:var(--water)} .sec .sun{fill:var(--gold)} .sec .vine{stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.sec .ray{stroke:var(--gold);stroke-width:2.5;fill:none} .sec .wind{stroke:var(--water);stroke-width:2.5;fill:none} .sec .rain{stroke:var(--water);stroke-width:1.5}
.sec .cloud{fill:var(--line);stroke:var(--muted)} .sec .ah{fill:var(--ink)}
.sec text{font-family:var(--body);font-size:11px;font-weight:600;fill:var(--ink)} .sec text.on{fill:var(--bg)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

function mk(code,topic,key,q,right,wrongs,why){
  wrongs=[...new Set(wrongs)].filter(w=>w!==right);
  if(wrongs.length<2)return null;

  return {code,topic,key,q,opts,a:opts.indexOf(right),why};
}

function makeQ(topic){

    const q=CQ[topic]?cQ(topic):topic==="druiven"?GQ[pick(Object.keys(GQ))]():topic==="gebieden"?RQ[pick(RQ_WEIGHT)]():termQ();

}
function tasteQ(){
  for(let i=0;i<40;i++){
    const w=pick(TASTE),g=byName(w[1]);
    const alt=shuffle(TASTE.filter(o=>o[1]!==w[1]&&byName(o[1]).c===g.c));
    const names=[],wr=[];for(const o of alt){if(!names.includes(o[1])){names.push(o[1]);wr.push(o[0])}if(wr.length===2)break}
    if(wr.length<2)continue;
    const opts=shuffle([w[0],...wr]);
    const notes=[["Geur",shuffle(g.ar).slice(0,4).join(", ")],["Zuur",words(g.z)]];
    if(g.t)notes.push(["Tannine",words(g.t)]);
    notes.push(["Smaak",g.body],["Mondgevoel",g.mond.split(" · ")[0]]);

  const s=store.stats[q.code]||(store.stats[q.code]={g:0,t:0});s.t++;if(ok)s.g++;
  const m=store.miss[q.key]||0;
  if(ok){if(m>1)store.miss[q.key]=m-1;else delete store.miss[q.key]}else store.miss[q.key]=m+1;
  tick();

}

  const r=hashN(g.n),rows=[[4,5,5,4,3,2,1],[3,4,5,5,4,3,2,1],[4,5,4,4,3,2,1],[5,5,4,3,2,1]][r%4];
  const fill=g.c==="w"?["#c8cf6f","#a9b54a","#e4e7a2"]:["#5a3463","#3e2148","#8a5f93"];
  let b="";const y0=58;
  rows.forEach((n,i)=>{for(let j=0;j<n;j++){const x=60+(j-(n-1)/2)*15+((i%2)?2:-2),y=y0+i*12.5,k=(i+j+r)%3;
    b+=`<circle cx="${x.toFixed(1)}" cy="${y}" r="8.2" fill="${fill[k===2?0:k]}" stroke="${fill[1]}" stroke-width="1"/><circle cx="${(x-2.6).toFixed(1)}" cy="${y-2.8}" r="2" fill="#fff" opacity=".45"/>`}});
  return `<svg class="drawn" viewBox="0 0 120 160" aria-hidden="true"><path d="M60 12 C61 26 60 38 60 50" stroke="#6b5a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M62 24 C78 8 104 10 110 26 C100 24 98 34 106 40 C92 42 90 34 84 44 C80 36 70 38 62 24Z" fill="#7e9a3c" stroke="#5c7428" stroke-width="1.2"/>
    <path d="M62 24 L96 30" stroke="#5c7428" stroke-width="1"/>${b}</svg>`;
}
function plate(g,w){
  const p=PLATES[g.n];
  return `<span class="plate">${cluster(g)}${p?`<img alt="Botanische plaat van ${h(g.n.toLowerCase())}" data-src="${fileUrl(p[0],w)}" data-alt="${altUrl(p[0],w)}">`:""}</span>`;
}
let warmed=false;
function warmPlates(){if(warmed)return;warmed=true;const go=()=>Object.values(PLATES).forEach(p=>{const i=new Image();i.decoding="async";i.src=fileUrl(p[0],500)});try{(window.requestIdleCallback||setTimeout)(go,1500)}catch(e){}}
function hookPlates(){
  if(!build&&!gview)warmPlates();

    im.addEventListener("load",()=>{im.parentNode.classList.add("loaded");const c=document.getElementById("platecredit");if(c)c.hidden=false});
    im.addEventListener("error",()=>{if(im.dataset.alt){const a=im.dataset.alt;im.removeAttribute("data-alt");im.src=a}else im.remove()});
    im.src=im.dataset.src;im.removeAttribute("data-src");

}
function scale(labels,range,cap){
  return `<div class="scale" style="grid-template-columns:repeat(${labels.length},1fr)">${labels.map((l,i)=>`<span class="${i>=range[0]&&i<=range[1]?"on":""}"><i></i><b>${l}</b></span>`).join("")}</div>${cap?`<p class="small muted">${h(cap)}</p>`:""}`;
}
const LV=["▼▼","▼","±","▲","▲▲","▲▲▲"],lvR=r=>[r[0]+2,r[1]+2];
const BODY=["licht","middelzwaar","vol","krachtig"];
function bodyRange(t){const i=BODY.map((w,k)=>new RegExp("(^|[^a-z])"+w+"([^a-z]|$)").test(t)?k:-1).filter(k=>k>=0);return i.length?[Math.min(...i),Math.max(...i)]:null}

const MOND=["zacht","strak","rond","soepel","stevig","stroef"];

function setCheck(sel,ok){const hit=sel.filter(s=>ok.includes(s)).length;return hit===ok.length&&sel.length===ok.length?"ok":hit?"half":"no"}
function checkBuild(){
  const b=build,g=b.g,s=b.sel,r=[];
  if(b.syn.length)r.push(["Andere naam",setCheck(s.syn,b.synOk),s.syn.join(", "),g.synT]);
  r.push(["Herkomst",setCheck(s.hk,g.h),s.hk.join(", "),g.hT]);
  r.push(["Rijping",RIJP_OK[g.r].includes(s.rijp)?"ok":"no",s.rijp,RIJP[g.r]]);
  r.push(["Zuur",cats(g.z).includes(s.zuur)?"ok":"no",s.zuur,words(g.z)]);
  if(g.t)r.push(["Tannine",cats(g.t).includes(s.tann)?"ok":"no",s.tann,words(g.t)]);
  r.push(["Aroma's",setCheck(s.ar,b.arOk),s.ar.join(", "),g.ar.join(", ")]);
  b.res=r;
  const score=Math.round(100*r.reduce((a,x)=>a+(x[1]==="ok"?1:x[1]==="half"?.5:0),0)/r.length);
  b.score=score;store.built[g.n]=Math.max(store.built[g.n]||0,score);
  const st=store.stats["1.3"]||(store.stats["1.3"]={g:0,t:0});st.t+=r.length;st.g+=r.filter(x=>x[1]==="ok").length;
  save();
}

function searchHits(term){
  const t=plain(term.trim());if(t.length<2)return [];
  const out=[],hit=x=>plain(x).includes(t);
  for(const g of G)if(hit(g.n)||g.syn.some(hit))out.push(["s-grape",g.n,g.n,"druif"+(g.syn.some(hit)&&!hit(g.n)?" · ook: "+g.syn.filter(hit).join(", "):"")]);
  for(const [land,D] of Object.entries(GEO))for(const r of all(D))if(hit(r.n))out.push(["s-region",land+"|"+r.n,r.n,"kaart · "+(r.parent?r.parent+", ":"")+land]);
  for(const x of TERMS)if(hit(x[0]))out.push([null,"",x[0],"term · hoort bij "+x[1]]);
  return out.slice(0,14);
}

  regions:[

    {n:"Kremstal",parent:"Niederösterreich",zl:9,druif:"grüner veltliner, riesling",kleur:"wit",ha:"2.200 ha",info:"In het binnenland ten noorden van Krems en ertegenover, op de zuidoever van de Donau. Zacht glooiend; de belangrijkste bodem is löss. DAC-wijnen zijn van grüner veltliner of riesling."},

    riv:["Water","Valais ligt in het dal van de Rhône, met de wijngaarden op steile hellingen. Algemene kennis, niet uit het boek: Vaud ligt aan het Meer van Genève, Ticino bij het Lago Maggiore en het meer van Lugano."],
    berg:["Bergen","In het Alpenland Zwitserland liggen de wijngaarden tussen 300 en 1100 meter, sommige extreem hoog. In Valais beschutten de bergen het dal: 's zomers kan het er flink warm worden, maar de nachten zijn koel."],
    lig:["Klimaat","Zwitserland ligt rond 46° NB. Het macroklimaat is gematigd warm, met grote verschillen tussen het koelere noordoosten en het warme westen. Het grootste deel van de wijnbouw ligt in het deel dat aan Frankrijk grenst."],
    bodem:["Bodem","De bodemsoorten lopen uiteen, van kalk tot zanderige klei. In Valais zijn de bodems kalkhoudend."]
  },
  sections:[["valais","Valais"]]
},

  layers:{
    riv:["Water","Bijna alle grote wijnstreken liggen aan een rivier: Loire, Rhône, Saône, Garonne en Dordogne, die samen de Gironde vormen. De Loire geeft in koude tijden warmte af aan de wijngaarden dicht bij de rivier. In Sauternes en aan de Layon zorgt het water voor vochtige ochtenden, ideaal voor edele rotting. Aan zee: Muscadet heeft een zeeklimaat, Bandol ligt pal aan de kust, en de wind uit zee verkoelt de Languedoc."],
    berg:["Bergen","De Vogezen houden wolken en regen uit het westen tegen: aan hun voet is Alsace een van de zonnigste streken (zie de doorsnede). In Savoie liggen de wijngaarden op de uitlopers van de Alpen, op 350 à 400 meter. De Pyreneeën beïnvloeden Madiran en Jurançon. Minervois ligt op de zuidhellingen van de Montagne Noire, Gigondas aan de voet van de Dentelles de Montmirail. In de Provence houden de bergen de zee-invloed soms juist tegen."],
    lig:["Klimaat","De wijngebieden liggen tussen 43 en 49° NB. Het klimaat is over het geheel gematigd warm, met volgens de kaart in het boek een koel noorden (Champagne, Alsace, Loire, Chablis), een matig warm midden en een warm mediterraan zuiden (Rhône, Provence, Languedoc). In het westen is de invloed van de Atlantische Oceaan groot, in het oosten is het meer continentaal. In het zuiden blaast de koude mistral: hij geeft schade, maar houdt schimmel weg. De lijnen zijn schematisch, net als in het boek."],
    bodem:["Bodem","Frankrijk heeft een enorme diversiteit aan wijnbodems. Kalk is belangrijk in Chablis (kimméridgien), de Côte d'Or, Champagne (krijt) en Sancerre. Graniet in de Beaujolais, de noordelijke Rhône en Muscadet. Kiezel en zand in de Médoc, rolkeien in Châteauneuf-du-Pape, schist in Banyuls."]
  },
  sections:[["vogezen","Vogezen en Alsace"],["cotedor","Helling Côte d'Or"]],
  regions:[
    {n:"Alsace",druif:"riesling, pinot blanc, gewurztraminer, pinot gris; in opkomst sylvaner en muscat; blauw: pinot noir",kleur:"90% wit, 10% rood",stijl:"geurig en sappig, van droog tot zoet; bijna altijd van één druif",ha:"15.600 ha",info:"Alsace (Elzas) ligt in het noordoosten, tegen Duitsland aan, op 48° NB. In het 'koele' noorden heerst hier toch een relatief warm klimaat: een van de zonnigste streken van Frankrijk, met lange warme zomers en zo'n 1800 zonuren per jaar. De Vogezen (400 tot 1400 m) houden wolken en regen uit het westen tegen; aan de zuidkant stroomt warmte binnen. De bodem varieert van zandsteen, kalk en klei tot graniet en leisteen. De beste wijngaarden liggen op het zuiden en zuidoosten, tussen 200 en 400 meter. Flûte d'Alsace is de verplichte flesvorm. Edelzwicker of Gentil = blend. Crémant d'Alsace is mousserend volgens de méthode traditionnelle. Sinds 2021 moet op het etiket staan of de wijn droog, halfdroog of zoet is. Vendanges Tardives (laat geoogst) en Sélection de Grains Nobles (edele rotting) zijn zoet en alleen van riesling, pinot gris, gewurztraminer en muscat. Er zijn 54 Grands Crus, meestal van die vier druiven; 3 voor pinot noir en 1 voor sylvaner (Zotzenberg)."},
    {n:"Bourgogne",druif:"vooral chardonnay en pinot noir",kleur:"62% wit, 28% rood en rosé, 10% Crémant de Bourgogne",ha:"30.000 ha",info:"Ongeveer net zo beroemd als Bordeaux, maar veel kleiner; 47° NB. Het hart is de Côte d'Or. Ook het noordelijke Chablis en de gebieden ten zuiden ervan, Côte Chalonnaise en Mâconnais, horen erbij; van Chablis tot de Mâconnais is het zo'n 200 km. Semicontinentaal klimaat: lange koude winters, korte warme zomers, nachtvorst in het voorjaar. Kalkrijke bodems met een goede drainage. Heuvelruggen worden onderbroken door kloven, combes. 33 grand-cruwijngaarden: 1 in Chablis, 32 in de Côte d'Or. Pyramide: Grand Cru, Premier Cru (640 climats), gemeente (bijv. Pommard), deel van het gebied (bijv. Côte de Nuits-Villages), Bourgogne. Zoom in voor de deelgebieden."},
    {n:"Beaujolais",druif:"gamay",kleur:"95% rood, 5% wit en rosé",stijl:"licht, boordevol rood fruit, soepel, weinig tannine, frisse zuren",ha:"19.000 ha",info:"Eigen gezicht door 3 dingen: graniet, gamay en macération semi-carbonique. 46° NB. Overgangsgebied met een gematigd semicontinentaal klimaat, met Atlantische en mediterrane invloeden. Verpulverd graniet vermengd met klei, zand en/of kalk. In het noorden, de groene, glooiende Haut-Beaujolais, liggen de 10 crus. Het zuiden, Bas-Beaujolais, is vlakker; daar komt de meeste generieke AOP Beaujolais vandaan. Pyramide: Crus du Beaujolais, Beaujolais Villages (noorden), Beaujolais en Beaujolais Nouveau of Primeur. Vinificatie: hele trossen in een afgesloten kuip; onderin gist het sap, het koolzuurgas beschermt tegen oxidatie. Gewone Beaujolais weekt 6 tot 10 dagen, Nouveau en Primeur 4 dagen."},
    {n:"Jura",druif:"wit: chardonnay, savagnin; blauw: pinot noir, trousseau, poulsard",kleur:"wit, rood, mousserend",stijl:"zelden uitgesproken fruitig; wit vaak nootachtig, rood met iets kruidigs als versgemalen peper",ha:"2000 ha",info:"Bergachtig gebied rond Arbois, tussen Bourgogne en Zwitserland; 47° NB. Landklimaat met koude winters en lange, milde zomers. Grootste risico: de druiven worden niet helemaal rijp, dus de ligging op het zuiden en zuidwesten is belangrijk. Kalkrijke klei. Specialiteiten: vin jaune (gele wijn, jarenlang op vat onder een gistlaag, fleur, zoals flor bij sherry) en vin de paille (strowijn, zoet, van op stromatten gedroogde druiven). Ook Crémant du Jura."},
    {n:"Savoie",druif:"wit: jacquère (de helft van de aanplant), altesse; blauw: gamay, mondeuse",kleur:"vooral wit, ook rood en mousserend",stijl:"lichtvoetig, droog wit; rood licht, fris en fruitig",ha:"1900 ha",info:"Klein gebied in de Franse Alpen, ten zuiden van het Meer van Genève; 45° NB. Koel klimaat met een kort groeiseizoen. Wijngaarden op de uitlopers van de Alpen, op 350 à 400 meter, in dalen tussen bergen en meren; alleen op plekken met een warm microklimaat. Zo'n 20 gemeenten, de meeste rond Chambéry, mogen hun naam op het etiket zetten. 75% wordt verkocht als Vin de Savoie."},
    {n:"Rhône",druif:"noord: syrah, viognier, marsanne, roussanne; zuid: grenache, syrah, mourvèdre, cinsault en meer",kleur:"79% rood, 14% rosé, 7% wit",ha:"70.000 ha",info:"Na Bordeaux het grootste wijnbouwgebied naar aantal appellations: meer dan 200 km langs de Rhône; 44-45° NB. Vorm van een omgekeerde trechter: in het noorden een smal dal met hellingen, ten zuiden van Montélimar breder en grootschaliger. Daarom een tweedeling: noordelijke en zuidelijke Rhône. Pyramide: Cru (bijv. Châteauneuf-du-Pape), Côtes du Rhône Villages + gemeentenaam, Côtes du Rhône Villages, Côtes du Rhône, IGP. Zoom in voor de deelgebieden."},
    {n:"Provence",druif:"grenache, cinsault, mourvèdre, tibouren, syrah; wit: rolle (vermentino)",kleur:"80% droge rosé",stijl:"bleke, strakdroge rosé",ha:"38.000 ha",info:"De eerste wijnstokken op Franse bodem, rond 600 voor Christus door Griekse kolonisten; 43-44° NB. Gunstig mediterraan klimaat, ruim 3000 zonuren, korte zachte winters. De koude mistral kan schade geven, maar verkoelt en voorkomt schimmelziektes: heel geschikt voor biologische wijnbouw. Bergachtig, met veel mesoklimaten; arme, zanderige en rotsachtige bodems. Voor rosé worden de druiven direct na de oogst zacht geperst. Sinds 1955 een eigen Cru Classé-klassement van wijnhuizen."},
    {n:"Corsica",druif:"nielluccio (Corsicaanse sangiovese), rolle (vermentino); ook cinsault, grenache, mourvèdre",kleur:"rood, rosé, wit",ha:"6000 ha",info:"Heel zonnig en warm, hete droge zomers, in augustus en september nauwelijks regen; 43-44° NB. Wijnbouw alleen langs de kust; het binnenland is te hoog en ruig. De beste bodems zijn kalkrijke klei. Italiaanse invloed is duidelijk. AOP Patrimonio heeft de beste reputatie."},
    {n:"Languedoc-Roussillon",druif:"",ha:"225.000 ha",info:"Samen het grootste wijnbouwgebied van Frankrijk, langs de Middellandse Zee van de Pyreneeën tot de Rhône; 43° NB. 13 miljoen hl per jaar, 30% van de Franse productie. Vroeger vooral bulkwijn, nu steeds meer kwaliteit en herkomst. Uitgesproken mediterraan klimaat met veel zon en wind; de wind uit zee verkoelt. Grote variatie aan bodems (zandsteen, kalksteen, leisteen) met een rotsige, kiezelrijke bovenlaag en garrigue. Aan de kust vlak en laag, landinwaarts hoger op hellingen."},
    {n:"Sud-Ouest",druif:"verschilt per gebied: o.a. cabernet sauvignon, merlot, cabernet franc, malbec, tannat; wit: sémillon, sauvignon blanc, gros en petit manseng, colombard",ha:"60.000 ha",info:"Een aantal kleinere wijnstreken in het zuidwesten, samen het vierde wijngebied van Frankrijk; 43-44° NB. Voor SDEN-niveau 3: de AOP's Bergerac, Cahors, Madiran en Jurançon en de IGP Côtes de Gascogne (populaire witte wijn van colombard, aangevuld met ugni blanc en folle blanche: licht, fris, fruitig, eenvoudig). Ze hebben op hun ligging na weinig gemeen. Gematigd warm met zee-invloed; kalkhoudende klei, ook kiezels."},
    {n:"Bordeaux",druif:"rood: cabernet sauvignon, merlot, cabernet franc (Bordeauxblend), aangevuld met petit verdot, malbec, carmenère; wit: sauvignon blanc, sémillon, soms muscadelle",kleur:"88% rood",ha:"112.000 ha, 12.000 wijnhuizen",info:"Een wijnwereld op zich: bakermat van cabernet sauvignon en merlot, de beste en duurste wijnen ter wereld, maar ook heel goedkope; 45° NB. Overwegend vlak, met enorme kastelen. Gematigd warm zeeklimaat, wisselvallig, met kans op schimmel in vochtige jaren; de pijnbossen in het westen beschermen tegen de Atlantische invloeden. Dicht beplant (gemiddeld 6000, tot 10.000 stokken per ha). De beste wijngaarden hebben een luchtige kiezelbodem op het zuiden. Linkeroever (rive gauche) van de Garonne, rechteroever (rive droite) van de Dordogne; daartussen Entre-Deux-Mers. Links meer cabernet sauvignon, rechts heerst merlot. Rijping vaak op barriques van 225 liter. Pyramide: Premier Grand Cru Classé, Grand Cru (Classé), Cru Bourgeois, gemeente (bijv. Pauillac), deel van het gebied (bijv. Médoc), Bordeaux Supérieur, Bordeaux. Classificatie 1855 van Médoc en Graves: 61 wijnhuizen in 5 klassen, op basis van de reputatie (prijzen) toen; enige wijziging: Mouton Rothschild in 1973 naar 1e cru. Sauternes-Barsac 1855: 27 chateaus, met Château d'Yquem als Premier Cru Supérieur. Cru Bourgeois sinds 1932, zo'n 250 chateaus, sinds 2020 elke 5 jaar herzien. Saint-Émilion heeft een eigen rangorde; Pomerol heeft er geen."},
    {n:"Loire",druif:"wit: melon de Bourgogne, chenin blanc, sauvignon blanc; blauw: cabernet franc (breton), ook gamay, cot, pinot noir",kleur:"50% wit, 25% rosé, 25% rood",ha:"55.000 ha",info:"Het meest uitgestrekte klassieke gebied, langs Frankrijks langste rivier (1006 km); 47° NB. Geen sprake van één type Loirewijn: frisse witte, rosé, rood, mousserend en beroemde zoete wijnen. Val de Loire (westen, van Nantes tot voorbij Blois, ca. 300 km: Pays Nantais, Anjou-Saumur, Touraine) en Centre-Loire (oosten; 'Centre' slaat op het midden van Frankrijk). Klimaat: aan de kust zeeklimaat, in Touraine ontmoeten Atlantisch en continentaal elkaar, Centre-Loire semicontinentaal. De rivier geeft warmte af. Vochtig: kans op schimmel; in koude jaren rijpen de druiven soms niet. Bodems: Muscadet en Anjou graniet en schist, vanaf Saumur kalkrijke klei en zand. Van west naar oost 3 witte druiven: melon de Bourgogne, chenin, sauvignon blanc. Crémant de Loire heeft een basis van chenin blanc."},
    {n:"Champagne",druif:"chardonnay, pinot noir, (pinot) meunier",kleur:"mousserend (ook rosé)",stijl:"fris, 10 à 11% alcohol in de basiswijn",ha:"33.000 ha",info:"De noordelijkste wijnstreek van Frankrijk, niet ver van Parijs; 49° NB. Koel, zonarm continentaal klimaat: de druiven rijpen langzaam, met weinig suiker en veel zuren. Vroeger een binnenzee: kalk- en krijtrijke bodem die als een spons werkt en warmte opneemt die hij 's nachts afstaat. Wijngaarden op tamelijk steile hellingen tussen 120 en 180 m; de hoogte beschermt tegen nachtvorst. Belangrijke gebieden: Montagne de Reims (heuvels tot 288 m; vooral pinot noir, ook meunier en chardonnay), Vallée de la Marne (zuidhellingen; vooral pinot noir, ook meunier), Côte des Blancs (krijt en kalk; vooral chardonnay op de zuidoostelijke hellingen). Méthode traditionnelle: assemblage van stille basiswijnen, tweede vergisting in de fles, liqueur de dosage (liqueur d'expédition). Dosage: Brut Nature/Dosage Zéro max. 3 g/l, Extra Brut max. 6, Brut max. 12, Demi-Sec 32 tot 50 g/l. Blanc de Noirs: alleen blauwe druiven; Blanc de Blancs: alleen chardonnay; Grand Cru: 17 gemeenten; Millésimé: één oogstjaar."}
  ],
  subs:[
    {n:"Grand Cru Hengst",parent:"Alsace",zl:10,druif:"op het etiketvoorbeeld: gewurztraminer (Vendange Tardive)",info:"Een van de 54 Grands Crus. Het etiketvoorbeeld in het boek is Alsace Grand Cru Hengst, Vendange Tardive, Gewurztraminer, Domaine Zind Humbrecht. Een Grand Cru d'Alsace is een terroirwijn van een wijngaard met een uitzonderlijke ligging en bodem."},
    {n:"Grand Cru Zotzenberg",parent:"Alsace",zl:10,druif:"sylvaner",info:"De enige Grand Cru voor sylvaner, ook de uitzondering bij Vendange Tardive en Sélection de Grains Nobles."},
    {n:"Chablis",parent:"Bourgogne",zl:7.5,druif:"chardonnay (100%)",kleur:"altijd wit",stijl:"opwekkend, beendroog, licht tot middelzwaar, ingetogen aroma's van wit fruit en blanke noten",ha:"5200 ha",info:"Meer dan 100 km van het hart van de Bourgogne; de indeling komt van de verdeling van land door hertogen in de 15de eeuw. Koel klimaat, vergelijkbaar met Champagne; wisselvallig weer en nachtvorst in het voorjaar. Heuvelachtig; de beste wijngaarden liggen pal op het zuiden. Kalkrijke klei van een bijzondere soort: kimméridgien, circa 155 miljoen jaar oud, mineraal- en fossielrijk, genoemd naar Kimmeridge in Zuid-Engeland. Pyramide: Chablis Grand Cru (7 climats, beste zonligging op het zuiden, dikke kimmeridge; droog, rijk, krachtig, vaak houtrijping, tijd nodig), Chablis Premier Cru (40 climats; droog, fris, middelzwaar, met of zonder hout), Chablis (droog, fris, licht, geen hout, jong drinken)."},
    {n:"Chablis Grand Cru",parent:"Chablis",zl:10,druif:"chardonnay",info:"7 climats (wijngaarden), beste zonligging op het zuiden, dikke kimmeridge-bodem. Droog, rijk, krachtig, complex, vaak met houtrijping, tijd nodig om op dronk te raken."},
    {n:"Côte de Nuits",parent:"Bourgogne",zl:8,druif:"pinot noir",kleur:"vooral rood",info:"Het noordelijke deel van de Côte d'Or, de 'kust van goud', van Dijon tot Nuits-Saint-Georges, langs de N74. Fantastische rode wijnen: 24 van de 33 grand-cruwijngaarden liggen hier, en op 1 na (Musigny) leveren ze allemaal rood. Veel gemeentenamen zijn samengesteld uit dorp + beroemdste wijngaard: Gevrey = dorp, (Le) Chambertin = grand cru. Beste wijngaarden halverwege de helling (150-400 m): premier en grand cru; boven arme bodem en lichte wijn, in de vlakte 'gewone' Bourgogne."},
    {n:"Gevrey-Chambertin",parent:"Côte de Nuits",zl:10,druif:"pinot noir",stijl:"rood, veel kleur, geurig, fruitig; jong robuust en stevig, op dronk krachtig en soepel",info:"Gevrey is het dorp, Le Chambertin de grand-cruwijngaard."},
    {n:"Chambolle-Musigny",parent:"Côte de Nuits",zl:10,druif:"pinot noir",stijl:"rood, elegant, delicaat, fruitig",info:"Hier ligt Musigny, de enige grand cru in de Côte de Nuits die ook witte wijn levert."},
    {n:"Vougeot",parent:"Côte de Nuits",zl:10.5,druif:"pinot noir",stijl:"rood, middelzwaar, tamelijk stevig, fruitig",info:"Beroemd wijnhuis: Château du Clos de Vougeot."},
    {n:"Vosne-Romanée",parent:"Côte de Nuits",zl:10,druif:"pinot noir",stijl:"rood, vol, soepel, geurig, complex",info:"Beroemd wijnhuis: Domaine de la Romanée-Conti."},
    {n:"Nuits-Saint-Georges",parent:"Côte de Nuits",zl:10,druif:"pinot noir, ook chardonnay",stijl:"vooral rood, ook wit; rood krachtig, stevig, relatief veel kleur",info:"Het stadje waar de Côte de Nuits naar heet."},
    {n:"Côte de Beaune",parent:"Bourgogne",zl:8,druif:"chardonnay (wit), pinot noir (rood)",info:"Het zuidelijke deel van de Côte d'Or, rond de stad Beaune. Vooral beroemd om grote witte wijnen, maar ook uitstekend rood, iets lichter en minder complex dan uit de Côte de Nuits. 8 grand-cruwijngaarden, die op 1 na (Corton) alleen wit leveren."},
    {n:"Aloxe-Corton",parent:"Côte de Beaune",zl:10,druif:"pinot noir, chardonnay",stijl:"rood en wit; stevig, fruitig, frisse zuren",info:"Hier ligt Corton, de enige grand cru in de Côte de Beaune voor rode wijn."},
    {n:"Pommard",parent:"Côte de Beaune",zl:10,druif:"pinot noir",stijl:"rood, donker van kleur, krachtig, stevig, tanninerijk",info:"In de pyramide het voorbeeld van een gemeentelijke appellation."},
    {n:"Volnay",parent:"Côte de Beaune",zl:10,druif:"pinot noir",stijl:"rood, middelzwaar, elegant, relatief zacht",info:"Direct ten zuiden van Pommard."},
    {n:"Meursault",parent:"Côte de Beaune",zl:10,druif:"chardonnay",stijl:"wit, vol, rond, nootachtig, boter",info:"Een van de beroemde witte gemeenten van de Côte de Beaune."},
    {n:"Puligny-Montrachet",parent:"Côte de Beaune",zl:10,druif:"chardonnay",stijl:"wit, rijk, complex, krachtig, elegant",info:"Een van de beroemde witte gemeenten van de Côte de Beaune."},
    {n:"Côte Chalonnaise",parent:"Bourgogne",zl:8,druif:"chardonnay, pinot noir",kleur:"wit, rood en mousserend",info:"De wijngaarden liggen iets hoger en anders ten opzichte van de zon dan in de Côte d'Or, waardoor de druiven minder gelijkmatig rijpen; rood is daardoor wat lichter. Herkomst van veel Crémant de Bourgogne (méthode traditionnelle). Bekendste gemeente: Mercurey."},
    {n:"Mercurey",parent:"Côte Chalonnaise",zl:10,druif:"pinot noir, ook chardonnay",stijl:"vooral rood, ook wit; middelzwaar, fruitig, fris",info:"Bekendste gemeente van de Côte Chalonnaise."},
    {n:"Mâconnais",parent:"Bourgogne",zl:8,druif:"chardonnay; blauw: pinot noir, gamay",kleur:"vooral wit, ook rood",info:"Al jaren in de belangstelling door de hoge kwaliteit en prettige prijs van de chardonnays. Witte wijn van de best gelegen hellingen vergist en rijpt vaak op houten vaten: vol, met aroma's van toast. Ook veel Crémant de Bourgogne."},
    {n:"Pouilly-Fuissé",parent:"Mâconnais",zl:10,druif:"chardonnay",info:"Levert de beste witte wijn uit de Mâconnais."},
    {n:"Saint-Amour",parent:"Beaujolais",zl:9.5,druif:"gamay",stijl:"lichtste cru, fris, rood fruit",info:"De noordelijkste van de 10 crus."},
    {n:"Juliénas",parent:"Beaujolais",zl:9.5,druif:"gamay",info:"Een van de 10 crus; het boek noemt hem alleen."},
    {n:"Chénas",parent:"Beaujolais",zl:9.5,druif:"gamay",info:"Een van de 10 crus; het boek noemt hem alleen."},
    {n:"Moulin-à-Vent",parent:"Beaujolais",zl:9.5,druif:"gamay",stijl:"stevig, fris, rood en zwart fruit",info:"Een van de 10 crus."},
    {n:"Fleurie",parent:"Beaujolais",zl:9.5,druif:"gamay",stijl:"fris, fruitig, elegant",info:"Een van de 10 crus."},
    {n:"Chiroubles",parent:"Beaujolais",zl:9.5,druif:"gamay",info:"Een van de 10 crus; het boek noemt hem alleen."},
    {n:"Morgon",parent:"Beaujolais",zl:9.5,druif:"gamay",stijl:"robuust, rijp fruit, kruidig",info:"Een van de 10 crus."},
    {n:"Régnié",parent:"Beaujolais",zl:9.5,druif:"gamay",info:"Een van de 10 crus; het boek noemt hem alleen."},
    {n:"Brouilly",parent:"Beaujolais",zl:9.5,druif:"gamay",info:"Een van de 10 crus, de zuidelijkste samen met Côte de Brouilly."},
    {n:"Côte de Brouilly",parent:"Beaujolais",zl:10.5,druif:"gamay",info:"Een van de 10 crus, op de helling midden in Brouilly."},
    {n:"Arbois",parent:"Jura",zl:9.5,druif:"zie Jura",info:"Het wijnstadje waar de Jura rond ligt."},
    {n:"Château-Chalon",parent:"Jura",zl:10,druif:"savagnin (algemene kennis)",info:"Bekend van vin jaune; dat deze appellation alleen vin jaune maakt, is algemene kennis, niet uit het boek."},
    {n:"Noordelijke Rhône",parent:"Rhône",zl:8,druif:"syrah (enige blauwe druif voor de crus); wit: viognier, marsanne, roussanne",kleur:"vooral rood; wit sterk in de minderheid",info:"Van Vienne tot de monding van de Drôme, ten zuiden van Valence. Semicontinentaal overgangsklimaat met vrij koude winters en warme zomers; naar het zuiden meer mediterrane invloed en de koude noordenwind, de mistral. Wijngaarden vooral op de westoever, op soms zeer steile hellingen, vaak terrassen. Bodem van graniet en afgeleiden zoals gneis en schist. Waar de wind vrij spel heeft, worden de stokken met 2 gekruiste palen gestut."},
    {n:"Côte-Rôtie",parent:"Noordelijke Rhône",zl:9.5,druif:"syrah + max. 20% viognier, samen vergist",kleur:"alleen rood",stijl:"krachtig, complex, rijk, terroirwijn met minerale tonen",info:"De noordelijkste cru van de Rhône. 'Geroosterde helling': rotsachtige wijngaarden die 's zomers de hele dag in de zon bakken. Net zo'n goede reputatie als Hermitage."},
    {n:"Condrieu",parent:"Noordelijke Rhône",zl:9.5,druif:"viognier",kleur:"wit",stijl:"aromatisch, rijk, complex, milde zuren",info:"Dé appellation voor grote witte wijn van viognier, op steile terrashellingen met graniet."},
    {n:"Hermitage",parent:"Noordelijke Rhône",zl:10,druif:"syrah + max. 15% marsanne en/of roussanne; wit: marsanne, roussanne",stijl:"rood krachtig, complex, rijk, zwart fruit, kan lang ouderen; wit geurig, complex, mineraal",info:"Een van de 2 appellations op de oostoever. De wijngaarden liggen op de granieten Hermitage-heuvel; al eeuwen beroemd, rood én wit (op basis van marsanne)."},
    {n:"Crozes-Hermitage",parent:"Noordelijke Rhône",zl:9.5,druif:"syrah + max. 15% marsanne en/of roussanne",stijl:"van middelzwaar, fris en fruitig tot krachtig en robuust",info:"De grootste appellation van de noordelijke Rhône, op de oostoever, deels om Hermitage heen en ten zuiden ervan."},
    {n:"Zuidelijke Rhône",parent:"Rhône",zl:8,druif:"grenache (basis van alle rode wijn), syrah, mourvèdre, cinsault, carignan; wit: grenache blanc, clairette, bourboulenc",info:"Begint ten zuiden van Montélimar en waaiert breed uit naar Languedoc en Provence. Mediterraan klimaat, zachte winters, hete droge zomers. De mistral blaast de lucht schoon: veel zon, weinig schimmel. Plateaus en heuvels van rivierafzettingen; veel kalk, en in het zuiden terrassen met rolkeien (galets roulés) op rode klei."},
    {n:"Châteauneuf-du-Pape",parent:"Zuidelijke Rhône",zl:9.5,druif:"grenache, syrah, mourvèdre, cinsault en meer",stijl:"krachtig, rijk, complex, warm; jong stevig, op dronk zacht",info:"De beroemdste appellation van de zuidelijke Rhône; de pausen van Avignon hadden hier hun zomerresidentie. Bodems van rolkeien op klei tot zand en kalksteen; oude vrijstaande grenachestokken in gobelet (bush vine). Ook wat wit."},
    {n:"Gigondas",parent:"Zuidelijke Rhône",zl:10,druif:"minstens 50% grenache + 15% syrah en/of mourvèdre",stijl:"stevig, vol, bes en kruidige, spicy tonen",info:"Aan de voet van de Dentelles de Montmirail, op kalkrijke bodem. Bijna even beroemd als Châteauneuf-du-Pape."},
    {n:"Beaumes-de-Venise",parent:"Zuidelijke Rhône",zl:10,druif:"muscat blanc à petits grains; rood vooral grenache en syrah",stijl:"Muscat: zoet, geurig, VDN; rood stevig, kruidig, fruitig",info:"Oostelijk van Châteauneuf-du-Pape en ten zuiden van Gigondas. Eigen AOP voor stevig rood, maar bekender om de goudgele Muscat de Beaumes-de-Venise, een VDN die goed bij ijsdesserts past."},
    {n:"Bandol",parent:"Provence",zl:9.5,druif:"mourvèdre, ook grenache en cinsault",kleur:"rood, rosé",info:"Pal aan zee. Reputatie dankzij rood van mourvèdre, dat door zijn dikke schil goed tegen hitte en droogte kan, in beschutte wijngaarden met kalkbodems. Kan uitstekend ouderen; ook de rosé is buitengewoon."},
    {n:"Patrimonio",parent:"Corsica",zl:9.5,druif:"nielluccio, rolle",info:"De AOP met de beste reputatie van Corsica, in het noorden van het eiland."},
    {n:"Corbières",parent:"Languedoc-Roussillon",zl:8.5,druif:"vooral carignan en grenache, ook syrah en mourvèdre",kleur:"90% rood, ook wit en rosé",stijl:"rustiek, pittig, mediterraan kruidig",info:"De grootste individuele appellation van de Languedoc. Heuvelachtig, ruig en winderig landschap. In de pyramide een voorbeeld van een specifiek gebied (top)."},
    {n:"Minervois",parent:"Languedoc-Roussillon",zl:8.5,druif:"vooral syrah, ook mourvèdre en grenache",kleur:"95% rood, ook wit en rosé",stijl:"volfruitig, rijpe tannine, zacht",info:"Belangrijke appellation met uitstekende kwaliteit; de wijngaarden liggen op de zuidelijke hellingen van de Montagne Noire."},
    {n:"Limoux",parent:"Languedoc-Roussillon",zl:9,druif:"chardonnay, chenin blanc, mauzac",kleur:"vooral wit en mousserend, ook rood",info:"Buitenbeentje, gespecialiseerd in mousserende en stille witte wijn, dankzij de hogere ligging en de invloed van de Atlantische Oceaan, die verkoelen. Crémant de Limoux: bubbel van vooral chardonnay. Blanquette de Limoux: mousserend van de lokale mauzac, ook volgens de méthode traditionnelle."},
    {n:"La Clape",parent:"Languedoc-Roussillon",zl:9.5,druif:"",info:"In de pyramide het voorbeeld van 'AOP + eigen naam': Languedoc La Clape."},
    {n:"Côtes du Roussillon Villages",parent:"Languedoc-Roussillon",zl:9,druif:"grenache, syrah, mourvèdre, carignan",kleur:"uitsluitend rood",stijl:"fruitig, kruidige garrigue-tonen en mediterrane kruiden, meestal soepel",info:"Alleen voor rode wijn uit dorpen in het heuvelachtige noordelijke deel van de Roussillon."},
    {n:"Rivesaltes",parent:"Languedoc-Roussillon",zl:9,druif:"grenache; muscat à petits grains voor Muscat de Rivesaltes",kleur:"zoet: wit, rood en rosé",info:"In de Roussillon; 2 soorten vin doux naturel. Muscat de Rivesaltes: zoet, 15 à 18% alcohol, van muscat à petits grains, duidelijk muskaatdruif. Rivesaltes: zoet, van grenache, minimaal 15% alcohol, in wit, rood en rosé. Een VDN ontstaat door de gisting te onderbreken met wijnalcohol, zodat er veel restsuiker blijft."},
    {n:"Banyuls",parent:"Languedoc-Roussillon",zl:9.5,druif:"grenache",info:"De bekendste vin doux naturel van de Roussillon, van dramatisch steile, zonovergoten wijngaarden met schistbodems. Traditioneel lang op houten vaten, soms buiten in de zon: bruinrood, oxidatieve aroma's. Modern gemaakt: roodpaars en fruitig."},
    {n:"Bergerac",parent:"Sud-Ouest",zl:8.5,druif:"rood: cabernet sauvignon, merlot, cabernet franc; wit: sémillon, sauvignon blanc",kleur:"droog en zoet wit, rood",stijl:"rood fruitig in de stijl van Bordeaux; wit droog en fris",info:"Het grootste deelgebied van Sud-Ouest en de naaste buur van Bordeaux, met een vergelijkbaar gematigd warm klimaat onder Atlantische invloed. Bodems van kalkhoudende klei of kiezels. Van oudsher ook zoete wijn."},
    {n:"Monbazillac",parent:"Bergerac",zl:10,druif:"sémillon, sauvignon blanc",stijl:"zoet, zacht wit",info:"Zoete wijn van overrijpe of door botrytis aangetaste (edelgerotte) druiven. Naar oppervlakte de grootste appellation ter wereld voor dit wijntype."},
    {n:"Cahors",parent:"Sud-Ouest",zl:9,druif:"malbec (= cot), tannat, merlot",kleur:"rood",stijl:"stevig, donkerrood, fruitige en kruidige aroma's",info:"Als enige appellation even ver van de Atlantische Oceaan als van de Middellandse Zee. Bakermat van malbec, hier nog cot genoemd. Kiezelbodems langs de Lot; veel kleur en tannine. Vroeger hard en stug, nu door rijper oogsten en betere vinificatie soepeler."},
    {n:"Madiran",parent:"Sud-Ouest",zl:9,druif:"minstens 50% tannat, met fer servadou, cabernet sauvignon en/of cabernet franc",kleur:"rood",stijl:"krachtig en stoer; nu fruitig en kruidig, in de stijl van Bordeaux",info:"In de Gascogne, waar ook armagnac vandaan komt. Klei en kiezel; gematigd warm klimaat met invloed van de Atlantische Oceaan en de Pyreneeën. Tannat heeft veel tannine en moet getemd worden. Madiran was de eerste met micro-oxygenatie (micro-bullage): kleine hoeveelheden zuurstof maken de tannine zachter."},
    {n:"Jurançon",parent:"Sud-Ouest",zl:9,druif:"gros manseng, petit manseng",kleur:"droog en zoet wit",stijl:"droog: fris, geurig, perzik; zoet: zacht, aromatisch, van ingedroogde druiven; altijd hoge zuren",info:"Kleine appellation bij Pau, aan de voet van de Pyreneeën. Tamelijk koel, maar het najaar blijft lang warm. De rijpste druiven zijn met passerillage: aan de stok ingedroogd."},
    {n:"Médoc",parent:"Bordeaux",zl:8,druif:"cabernet sauvignon, merlot, cabernet franc",kleur:"rood",info:"Linkeroever, ten noordwesten van de stad Bordeaux, langs de Gironde. Overwegend kiezel en zand, die snel opwarmen en goed draineren. De beste wijngaarden liggen in de Haut-Médoc, dicht bij de Gironde, op glooiende kiezelrijke hellingen, de croupes graveleuses: volle, complexe wijnen. Hier zitten de Grands Crus Classés. In de pyramide het voorbeeld van een deel van het gebied."},
    {n:"Haut-Médoc",parent:"Médoc",zl:8.8,druif:"cabernet sauvignon, merlot, cabernet franc",info:"Het zuidelijke deel van de Médoc, met de beroemde gemeenten Saint-Estèphe, Pauillac, Saint-Julien, Listrac, Moulis en Margaux."},
    {n:"Saint-Estèphe",parent:"Haut-Médoc",zl:10,druif:"meer cabernet sauvignon en cabernet franc",stijl:"krachtig, robuust",info:"De noordelijkste van de beroemde gemeenten van de Haut-Médoc."},
    {n:"Pauillac",parent:"Haut-Médoc",zl:10,druif:"meer cabernet sauvignon en cabernet franc",stijl:"krachtig, robuust",info:"Hier liggen 3 van de 5 Premiers Grands Crus Classés: Lafite Rothschild, Mouton Rothschild en Latour. Etiketvoorbeeld in het boek: Grand Vin de Château Latour, Premier Grand Cru Classé, Pauillac."},
    {n:"Saint-Julien",parent:"Haut-Médoc",zl:10,druif:"meer cabernet sauvignon en cabernet franc",stijl:"krachtig, robuust",info:"Tussen Pauillac en Margaux."},
    {n:"Listrac-Médoc",parent:"Haut-Médoc",zl:10,druif:"meer merlot",stijl:"wat soepeler en eleganter",info:"Een van de beroemde gemeenten van de Haut-Médoc, iets landinwaarts."},
    {n:"Moulis",parent:"Haut-Médoc",zl:10.5,druif:"meer merlot",stijl:"wat soepeler en eleganter",info:"Een van de beroemde gemeenten van de Haut-Médoc, naast Listrac."},
    {n:"Margaux",parent:"Haut-Médoc",zl:10,druif:"meer merlot",stijl:"wat soepeler en eleganter",info:"Thuis van Château Margaux, Premier Grand Cru Classé."},
    {n:"Pessac-Léognan",parent:"Bordeaux",zl:9,druif:"rood: cabernet sauvignon, merlot; wit: sauvignon blanc, sémillon",kleur:"rood en wit",stijl:"rond en stevig, soms aardse tonen; wit droog, vaak houtgerijpt",info:"Direct ten zuiden van de stad, tussen de pijnboombossen. Thuis van Château Haut-Brion, Premier Grand Cru Classé."},
    {n:"Graves",parent:"Bordeaux",zl:8.5,druif:"rood: cabernet sauvignon, merlot; wit: sauvignon blanc, sémillon",kleur:"vooral rood, ook grote houtgerijpte witte",stijl:"rond en stevig, wat lichter en sappiger dan Médoc",info:"Ten zuiden van Bordeaux, langs de Garonne. Lichtere bodem met meer zand dan in de Médoc."},
    {n:"Sauternes",parent:"Bordeaux",zl:9.5,druif:"sauvignon blanc, sémillon",stijl:"goudgeel en zoet, met pourriture noble",info:"Warm hoekje bij het water: ideaal voor botrytis cinerea, edele rotting. De beste huizen plukken in 8 à 10 rondgangen (tri successif), van september tot ver in oktober of november. Château d'Yquem is Premier Cru Supérieur."},
    {n:"Barsac",parent:"Bordeaux",zl:10,druif:"sauvignon blanc, sémillon",stijl:"goudgeel en zoet, met pourriture noble",info:"Naast Sauternes; dezelfde edelzoete wijnen."},
    {n:"Entre-Deux-Mers",parent:"Bordeaux",zl:8.5,druif:"wit: sauvignon blanc; rood: merlot, cabernet sauvignon",stijl:"wit droog, fris, fruitig; rood fruitig, soepeler en eenvoudiger dan Médoc",info:"'Tussen 2 zeeën': tussen Garonne en Dordogne. Bekend van droge witte wijn, maar er wordt ook heel veel rood gemaakt."},
    {n:"Saint-Émilion",parent:"Bordeaux",zl:9,druif:"merlot, cabernet franc",kleur:"rood",stijl:"complex, verfijnd, meestal iets soepeler dan Médoc",info:"Rechteroever (Libournais, naar de stad Libourne). Kalkrijke klei en tamelijk arm zand. Château Cheval Blanc, Premier Grand Cru Classé A, is grotendeels van cabernet franc. Eigen rangorde: Saint-Émilion, Saint-Émilion Grand Cru, Grand Cru Classé (64 chateaus) en Premier Grand Cru Classé (18 chateaus)."},
    {n:"Pomerol",parent:"Bordeaux",zl:9.5,druif:"vooral merlot, ook cabernet franc",kleur:"rood",stijl:"krachtig, rijk, stevig, complex, voller dan Saint-Émilion",info:"Klei met veel minder kalk. Geen classificatie, maar Petrus (100% merlot) is de beroemdste en duurste wijn van de hele Bordeaux."},
    {n:"Lalande-de-Pomerol",parent:"Bordeaux",zl:9.5,druif:"vooral merlot, ook cabernet franc",stijl:"lichter, eenvoudiger en eerder op dronk dan Pomerol",info:"Ten noorden van Pomerol."},
    {n:"Fronsac",parent:"Bordeaux",zl:9.5,druif:"vooral merlot, ook cabernet franc en cabernet sauvignon",kleur:"rood",info:"Rechteroever, ten westen van Libourne."},
    {n:"Blaye",parent:"Bordeaux",zl:9,druif:"rood: merlot of Bordeauxblend; wit: colombard, ugni blanc, sauvignon blanc, sémillon, muscadelle",kleur:"rood en droog wit",stijl:"rood middelzwaar, fruitig, soepel; wit droog, fris, fruitig",info:"Ook Côtes de Blaye en Côtes de Bordeaux-Blaye genoemd. Rechteroever van de Gironde."},
    {n:"Bourg",parent:"Bordeaux",zl:9.5,druif:"vooral merlot en cabernet franc, ook cabernet sauvignon (geen carmenère en petit verdot)",kleur:"rood, ook wit",stijl:"middelzwaar, fruitig, soepel",info:"Côtes de Bourg: heuvelachtiger dan elders in Bordeaux; côtes betekent hellingen."},
    {n:"Côtes de Bordeaux",parent:"Bordeaux",zl:8.5,druif:"Bordeauxblend",kleur:"rood",info:"Regionale AOP voor rode wijn, met de gemeente-appellations Blaye, Cadillac, Castillon, Francs en Sainte-Foy. De AOP Premières Côtes de Bordeaux geldt alleen voor zoete witte wijn van sémillon, sauvignon blanc en muscadelle."},
    {n:"Muscadet",parent:"Loire",zl:8.5,druif:"melon de Bourgogne",kleur:"wit",stijl:"droog, licht, fris, groene appel, 'zilt'",info:"De wijn uit Pays Nantais, rond Nantes. Muscadet sur Lie rijpt verplicht tot maart na de oogst op zijn bezinksel (lie) en smaakt voller. Rijping in houten vaten is heel ongebruikelijk."},
    {n:"Anjou",parent:"Loire",zl:8.5,druif:"wit: chenin blanc; rood: cabernet franc, cabernet sauvignon, gamay; rosé: o.a. grolleau",kleur:"wit, rosé, rood, droog en zoet",info:"Enorme diversiteit. Droge witte Anjou is grotendeels chenin blanc; rood meestal licht en fruitig. Rosé d'Anjou is halfdroog, van onder andere grolleau."},
    {n:"Savennières",parent:"Anjou",zl:10,druif:"chenin",kleur:"wit: droog (sec), halfdroog (demi-sec), zoet (moelleux)",stijl:"stevig, intens, van geel fruit tot honing, fikse zuren",info:"Prototype van een chenin-wijn, op vulkanische leisteen, op steile hellingen langs de Loire. Bekend wijnhuis: Clos de la Coulée de Serrant."},
    {n:"Coteaux du Layon",parent:"Anjou",zl:9.5,druif:"chenin",stijl:"zoet, fluweelzacht, geel fruit, citrus, honing, mineralen, complex",info:"Appellation voor zoete wijn van (gedeeltelijk) door botrytis aangetaste druiven. Aan de oevers van de Layon is het 's ochtends vochtig en warmt het later op: ideaal voor edele rotting."},
    {n:"Saumur",parent:"Loire",zl:9,druif:"chenin, sauvignon blanc, voor mousserend ook chardonnay; rood: cabernet franc",kleur:"wit, rood, mousserend",info:"Saumur Blanc is droog en fris, van 100% chenin. Rood grotendeels van cabernet franc, lekker fruitig; de beste en beroemdste komt uit Saumur-Champigny."},
    {n:"Saumur-Champigny",parent:"Saumur",zl:10,druif:"cabernet franc",kleur:"rood",info:"De beste en beroemdste rode Saumur."},
    {n:"Vouvray",parent:"Loire",zl:9.5,druif:"chenin; voor mousserend ook chardonnay en sauvignon blanc",kleur:"wit: droog, halfdroog, (edel)zoet en mousserend",stijl:"hoog zuurgehalte; jong fris en fruitig, ouder honing, noten, soms truffel",info:"Chenin blanc speelt de hoofdrol; de droge Vouvray is een terroirwijn."},

    <text x="356" y="74" text-anchor="end">1800 uur zon</text><text x="300" y="175" class="on">Elzas</text><text x="6" y="174" class="on">west</text></svg>`,
    "De Vogezen (400 tot 1400 meter) vangen de wolken en regen uit het westen: aan de westkant valt zo'n 1900 mm, aan de oostkant maar 500 mm. Daardoor is Alsace, in het 'koele' noorden, een van de zonnigste streken van Frankrijk, met gemiddeld 1800 zonuren. Aan de zuidkant zijn geen bergen of bossen, dus warmte uit het zuiden kan binnenstromen. Getallen uit het boek, p. 78."];
  if(id==="cotedor")return [open+`<path class="land" d="M0 180V168L120 160L200 120L250 76L300 44L360 30V180Z"/>
    <line class="par" x1="196" y1="124" x2="360" y2="124"/><line class="par" x1="282" y1="56" x2="360" y2="56"/>
    ${vines(40,166,170,148,5)}${vines(208,114,272,64,4)}${vines(300,44,340,36,2)}<circle class="sun" cx="40" cy="40" r="15"/>
    <line class="ray" x1="56" y1="50" x2="226" y2="96" marker-end="url(#ah)"/>
    <text x="4" y="150">vlakte: vruchtbaar</text><text x="4" y="138">gewone Bourgogne</text>
    <text x="120" y="80">helling: premier</text><text x="120" y="94">en grand cru</text>
    <text x="250" y="20">top: arm, koel</text><text x="352" y="174" text-anchor="end" class="on">150-400 m</text><text x="6" y="176" class="on">oost</text></svg>`,
    "Op de helling van de Côte d'Or (150 tot 400 meter) bepalen ligging en bodem de kwaliteit. In de vlakte is de bodem vruchtbaar, krijgen de druiven wat minder zon en is de afwatering minder: wijngaarden voor de 'gewone' Bourgogne. Halverwege de steilere helling is de bodem geschikt en de afwatering beter: hier liggen de premier- en grand-cruwijngaarden. Bovenaan is de bodem erg arm en koel: lichte wijnen en druiven die niet altijd rijp worden. Naar het boek, p. 83."];
  if(id==="valais")return [open+`<path class="land" d="M0 180V22L42 26L150 140H210L304 32L360 28V180Z"/><rect class="water" x="160" y="140" width="40" height="8"/>
    ${vines(62,58,140,128,6)}<circle class="sun" cx="300" cy="70" r="14"/>
    <line class="ray" x1="286" y1="76" x2="132" y2="104" marker-end="url(#ah)"/>
    <text x="180" y="172" text-anchor="middle" class="on">Rhône</text><text x="8" y="172" class="on">noord</text><text x="320" y="172" class="on">zuid</text>
    <text x="70" y="16">steil, kalkhoudend</text><text x="196" y="112">zomer warm,</text><text x="196" y="126">nachten koel</text></svg>`,
    "De wijngaarden van Valais liggen op steile hellingen langs de Rhône, op kalkhoudende bodems. Beschut tussen de bergen kan het 's zomers flink warm worden, maar dankzij de koele nachten rijpen de druiven gelijkmatig."];
  return [open+`<path class="land" d="M0 180V142H56Q130 4 204 122L330 150H360V180Z"/>
    ${vines(214,116,322,140,7)}<circle class="sun" cx="300" cy="38" r="16"/>

    <text x="4" y="22">koude luchtstromen</text><text x="130" y="128" text-anchor="middle" class="on">Pfälzerwald</text><text x="268" y="88" text-anchor="middle">Pfalz: mild</text><text x="268" y="102" text-anchor="middle">amandel en vijg</text>
    <text x="6" y="174" class="on">west</text></svg>`,
    "De wijngaarden liggen in een strook van zo'n 80 km aan de voet van het Pfälzerwald. Dat houdt koude luchtstromen tegen, waardoor het hier zo mild is dat er amandel- en vijgenbomen groeien."];
}
function vGeo(){
  const D=GEO[geo.land],q=geo.quiz,r=geo.sel&&all(D).find(x=>x.n===geo.sel),n=q?q.order.length:all(D).length,hasKids=r&&all(D).some(x=>x.parent===r.n);
  const note=geo.noTiles?"De reliëfkaart laadt hier niet. Op GitHub verschijnt hij onder de gebieden.":geo.credit?TILE[geo.prov].credit:"Reliëf laden…";
  const sec=section(geo.sec);
  return `<div class="row">${Object.keys(GEO).map(k=>`<button class="chip" data-act="g-land" data-n="${k}" aria-pressed="${geo.land===k}">${k}</button>`).join("")}</div><h2>${h(D.title)}</h2>
  ${q?(q.i<n?`<p class="note"><strong>Tik op: ${h(q.order[q.i])}</strong> <span class="muted">(${q.i+1} van ${n})</span>${q.wrong?`<br>Dat is ${h(q.wrong)}. Probeer het nog eens.`:""}</p>`:`<p class="note"><strong>${q.good} van de ${n} in één keer goed.</strong></p>`):""}
  <div class="mapwrap" id="mapwrap">${mapSVG()}<div class="mapctl"><button data-act="g-plus" aria-label="Inzoomen">+</button><button data-act="g-minus" aria-label="Uitzoomen">−</button><button data-act="g-home" aria-label="Heel ${h(D.title)}">⌂</button></div></div>
  <p class="src" id="tilenote">${h(note)} ${h(D.grens)}</p>
  <p class="muted small">Knijp, scroll of dubbeltik om in te zoomen. Ingezoomd verschijnen de deelgebieden, plaatsen en belangrijkste druiven uit het boek. Tik op een onderstreepte druif voor zijn pagina.</p>
  <div class="row"><button class="chip" data-act="g-explore" aria-pressed="${!q}">Verkennen</button><button class="chip" data-act="g-quiz" aria-pressed="${!!q}">${q&&q.i>=n?"Opnieuw overhoren":q&&q.root?"Overhoor me: "+h(q.root):!q&&hasKids?"Overhoor me: "+h(r.n):"Overhoor me"}</button></div>
  ${q?"":`${r?`<section class="card"><div class="row between"><h2>${h(r.n)}</h2><button class="chip" data-act="g-zoom">Zoom in</button></div><dl>${r.parent?`<dt>Ligt in</dt><dd>${h(r.parent)}</dd>`:""}${r.druif?`<dt>Druiven</dt><dd>${h(r.druif)}</dd>`:""}${r.kleur?`<dt>Aandeel</dt><dd>${h(r.kleur)}</dd>`:""}${r.stijl?`<dt>Wijn</dt><dd>${h(r.stijl)}</dd>`:""}${r.ha?`<dt>Wijngaard</dt><dd>${h(r.ha)}</dd>`:""}</dl><p>${h(r.info)}</p></section>`:`<p class="muted small">Tik op een gebied voor uitleg.</p>`}
  <section class="card"><h3>Wat bepaalt het klimaat?</h3><div class="row">${Object.entries(D.layers).map(([k,l])=>`<button class="chip" data-act="g-layer" data-id="${k}" aria-pressed="${geo.layer===k}">${l[0]}</button>`).join("")}</div>
    ${geo.layer?`<p class="note">${h(D.layers[geo.layer][1])}</p>`:""}</section>
  <section class="card"><h3>Doorsneden</h3><div class="row">${D.sections.map(x=>`<button class="chip" data-act="g-sec" data-id="${x[0]}" aria-pressed="${geo.sec===x[0]}">${x[1]}</button>`).join("")}</div>${sec[0]}<p class="small">${h(sec[1])}</p></section>
  <p class="src">${h(D.src)}</p>`}`;
}
function hookTiles(){
  const imgs=[...view.querySelectorAll("svg.map image")];if(!imgs.length)return;
  let bad=0,good=0;const p=geo.prov;
  imgs.forEach(im=>{
    im.addEventListener("load",()=>{good++;if(!geo.credit){geo.credit=true;const el=document.getElementById("tilenote");if(el)el.textContent=TILE[geo.prov].credit+" "+GEO[geo.land].grens}});
    im.addEventListener("error",()=>{im.remove();bad++;if(bad===imgs.length&&!good&&geo.prov===p&&!geo.noTiles){if(geo.prov+1<TILE.length)geo.prov++;else geo.noTiles=true;geo.credit=false;if(tab==="kaart")render()}});
  });
}

function render(){
  view.innerHTML=tab==="start"?vStart():tab==="overhoren"?vQuiz():tab==="opbouwen"?vBuild():tab==="kaart"?vGeo():vTaste();
  if(tab==="kaart"){hookTiles();hookMap()}
  if(tab==="opbouwen"||tab==="start")hookPlates();
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}
function toggle(arr,v){const i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1)}
function top(){try{window.scrollTo(0,0)}catch(e){}}

document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;confirmReset=false;try{location.hash=tab}catch(e){}render();top()});
view.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,d=b.dataset;let scroll=false;
  if(a==="topic")toggle(setup.topics,d.id);
  else if(a==="count")setup.n=+d.n;
  else if(a==="start"||a==="again"){quiz={qs:makeQuiz(setup.topics,setup.n),i:0,pick:null,log:[]};scroll=true}
  else if(a==="answer"){const q=quiz.qs[quiz.i];quiz.pick=+d.i;const ok=quiz.pick===q.a;quiz.log.push({q,pick:quiz.pick,ok});record(q,ok);
    if(quiz.exam){quiz.i++;quiz.pick=null;if(quiz.i>=quiz.qs.length)finishExam();scroll=true}}
  else if(a==="q-wrong"){const qs=shuffle(store.wrong).slice(0,20).map(w=>{const opts=shuffle([w.r,...w.w]);return {code:w.code,topic:w.topic,key:w.key,q:w.q,opts,a:opts.indexOf(w.r),why:w.why,src:w.src}});
    if(qs.length){quiz={qs,i:0,pick:null,log:[],fromWrong:true};tab="overhoren";try{location.hash=tab}catch(e){}scroll=true}}
  else if(a==="q-exam"){quiz=examQuiz();scroll=true}
  else if(a==="s-grape"){tab="opbouwen";build=null;gview=d.n;zoek="";try{location.hash=tab}catch(e){}scroll=true}
  else if(a==="s-region"){const [land,n]=d.n.split("|"),D=GEO[land],r=all(D).find(x=>x.n===n);tab="kaart";zoek="";geo.land=land;geo.quiz=null;geo.sel=n;geo.sec=D.sections[0][0];
    if(r){fitBox(regionBox(r));geo.z=Math.max(geo.z,(r.zl||D.zdeep||ZPLACES)+.2)}try{location.hash=tab}catch(e){}scroll=true}
  else if(a==="theme"){store.theme=d.id;save();applyTheme()}
  else if(a==="bk-make"){bkText=JSON.stringify(store);bkMsg="Back-up gemaakt. Kopieer de tekst hierboven en bewaar hem, bijvoorbeeld in een notitie of een mail aan jezelf.";try{navigator.clipboard.writeText(bkText).then(()=>{bkMsg="Back-up gekopieerd. Plak hem in een notitie of een mail aan jezelf om hem te bewaren.";render()}).catch(()=>{})}catch(e){}}
  else if(a==="bk-load"){const el=document.getElementById("bk"),v=el?el.value.trim():"";bkText=v;
    try{const o=JSON.parse(v);if(!o||typeof o!=="object"||!o.stats)throw 0;store=Object.assign(fresh(),o);save();applyTheme();bkMsg="Teruggezet. Je voortgang is weer zoals in de back-up."}catch(e){bkMsg=v?"Dit is geen geldige back-up. Plak de hele tekst, van { tot en met }.":"Plak eerst de tekst van je back-up in het vak."}}
  else if(a==="next"){quiz.i++;quiz.pick=null;quiz.flagged=false;scroll=true}
  else if(a==="stop"){quiz=null;scroll=true}
  else if(a==="grape"){newBuild(byName(d.n));scroll=true}
  else if(a==="gview"){build=null;gview=d.n;scroll=true}
  else if(a==="randgrape"){const todo=G.filter(g=>store.built[g.n]===undefined);newBuild(pick(todo.length?todo:G));scroll=true}
  else if(a==="buildback"){build=null;gview=null;scroll=true}
  else if(a==="b-hk")toggle(build.sel.hk,d.v);
  else if(a==="b-ar")toggle(build.sel.ar,d.v);
  else if(a==="b-syn")toggle(build.sel.syn,d.v);
  else if(a==="b-rijp")build.sel.rijp=d.v;
  else if(a==="b-zuur")build.sel.zuur=d.v;
  else if(a==="b-tann")build.sel.tann=d.v;
  else if(a==="check"){checkBuild();scroll=true}
  else if(a==="t-answer"){taste.pick=+d.i;const s=store.stats["6a.3"]||(store.stats["6a.3"]={g:0,t:0});s.t++;if(taste.pick===taste.q.a)s.g++;tick();save()}
  else if(a==="t-next"){taste=null;scroll=true}
  else if(a==="tasted"){if(store.tasted[d.i])delete store.tasted[d.i];else store.tasted[d.i]=true;save()}
  else if(a==="go"){tab=d.tab;try{location.hash=tab}catch(e){}scroll=true}
  else if(a==="flag"){if(!quiz.flagged){const q=quiz.qs[quiz.i];store.flags.push({q:q.q,a:q.opts[q.a],src:q.src});save();quiz.flagged=true;copied=false}}
  else if(a==="flag-grape"){if(!build.flagged){store.flags.push({q:"Druivenprofiel "+build.g.n,a:"het profiel zoals de app het toont",src:"Boek p. "+build.g.p});save();build.flagged=true;copied=false}}
  else if(a==="copyflags"){try{navigator.clipboard.writeText(flagText()).then(()=>{copied=true;render()}).catch(()=>{const t=document.getElementById("flags");if(t)t.select()})}catch(e){const t=document.getElementById("flags");if(t)t.select()}return}
  else if(a==="clearflags"){store.flags=[];save();copied=false}
  else if(a==="g-region"){if(Date.now()-geo.lastMove<450)return;const q=geo.quiz;if(q&&q.i<q.order.length){const ok=d.n===q.order[q.i];if(ok){record({code:"4.3",key:"kaart:"+d.n},q.first);if(q.first)q.good++;q.i++;q.wrong=null;q.first=true}else{q.wrong=d.n;q.first=false}}else if(!q)geo.sel=d.n}
  else if(a==="g-layer")geo.layer=geo.layer===d.id?null:d.id;
  else if(a==="g-quiz"){const D=GEO[geo.land],A=all(D),kids=n=>A.filter(x=>x.parent===n).flatMap(x=>[x].concat(kids(x.n))),selN=geo.sel||(geo.quiz&&geo.quiz.root),sub=selN?kids(selN):[],root=sub.length?A.find(x=>x.n===selN):null;
    const pool=root?sub:D.quizTop?D.regions:A;geo.quiz={order:shuffle(pool.map(r=>r.n)),i:0,wrong:null,first:true,good:0,root:root&&root.n};
    if(root){fitBox(regionBox(root));geo.z=Math.max(geo.z,Math.min(...sub.map(x=>x.zl||D.zdeep||ZPLACES)))}else geo.c=null;geo.sel=null;scroll=true}
  else if(a==="g-explore")geo.quiz=null;
  else if(a==="g-zoom"){const D=GEO[geo.land],r=all(D).find(x=>x.n===geo.sel);if(r){fitBox(regionBox(r));geo.z=Math.max(geo.z,(r.zl||D.zdeep||ZPLACES)+.2)}try{document.getElementById("mapwrap").scrollIntoView({block:"start",behavior:"smooth"})}catch(e){}}
  else if(a==="g-home")geo.c=null;
  else if(a==="g-land"){if(geo.land!==d.n){geo.land=d.n;geo.c=null;geo.sel=null;geo.quiz=null;geo.sec=GEO[d.n].sections[0][0]}}
  else if(a==="g-grape"){if(Date.now()-geo.lastMove<450)return;tab="opbouwen";build=null;gview=d.n;try{location.hash=tab}catch(e){}scroll=true}
  else if(a==="g-plus"){zoomBy(2);return}
  else if(a==="g-minus"){zoomBy(.5);return}
  else if(a==="g-sec")geo.sec=d.id;
  else if(a==="reset")confirmReset=true;
  else if(a==="reset-no")confirmReset=false;
  else if(a==="reset-yes"){const t=store.theme;store=fresh();store.theme=t;save();confirmReset=false;bkText="";bkMsg=""}
  render();if(scroll)top();
});
view.addEventListener("input",e=>{if(e.target.id==="zoek"){zoek=e.target.value;const r=document.getElementById("zoekres");if(r)r.innerHTML=hitsHTML(zoek)}});
view.addEventListener("change",e=>{if(e.target.id==="examdate"){store.exam=e.target.value||"";save();render()}});
// Klok van het oefenexamen: alleen het klokje bijwerken; is de tijd om, dan stopt het examen.
setInterval(()=>{if(!quiz||!quiz.exam||quiz.done)return;const left=quiz.end-Date.now();if(left<=0){quiz.timeup=true;finishExam();if(tab==="overhoren"){render();top()}}else{const c=document.getElementById("clock");if(c)c.textContent=clock(left)}},1000);
load();applyTheme();
const start=(location.hash||"").slice(1);if(["start","overhoren","opbouwen","kaart","proeven"].includes(start))tab=start;

}
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
