<style>
/* Layout: one column for a phone, tab bar at the bottom, cards only for the thing you act on. */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --ink:#1c2420; --muted:#5a685f; --line:#dde2d8;
  --accent:#7a1f3d; --accent-ink:#ffffff; --leaf:#55752a; --gold:#a8831f;
  --good:#2b7a4b; --bad:#b0352d; --warn:#996a12; --water:#2f78a8;
  --good-bg:#e3f1e7; --bad-bg:#f8e4e1; --warn-bg:#f6ecd4;
  --paper:#f4efe2;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131714; --surface:#1d231f; --ink:#e8ece5; --muted:#9ba89e; --line:#2e3731;
    --accent:#e07f9b; --accent-ink:#22090f; --leaf:#a8c56a; --gold:#dfbd62;
    --good:#74c492; --bad:#f08e84; --warn:#e2b464; --water:#7db9dc;
    --good-bg:#1c3326; --bad-bg:#3a201d; --warn-bg:#352a14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131714; --surface:#1d231f; --ink:#e8ece5; --muted:#9ba89e; --line:#2e3731;
  --accent:#e07f9b; --accent-ink:#22090f; --leaf:#a8c56a; --gold:#dfbd62;
  --good:#74c492; --bad:#f08e84; --warn:#e2b464; --water:#7db9dc;
  --good-bg:#1c3326; --bad-bg:#3a201d; --warn-bg:#352a14;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
header h1{font-family:var(--display);font-size:1.5rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
main{max-width:640px;margin:0 auto;padding:10px 16px 104px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:1.2rem;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 18px;font-weight:700;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;min-height:40px;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.off{opacity:.5;border-style:dashed;cursor:default}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:52px}
.opt b{font-family:var(--display);color:var(--muted);min-width:1.1em}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right b{color:var(--good)} .opt.wrong b{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:9px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:3px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.half{background:var(--warn-bg);color:var(--warn)}
.pill.code{background:transparent;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--leaf);padding:2px 0 2px 12px;font-size:.92rem}
.grapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.grape{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;min-height:58px;font-size:.92rem}
.grape .plate{height:46px;border-radius:6px}
.grape em{display:block;font-style:normal;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grape.w{border-left:5px solid var(--gold)} .grape.b{border-left:5px solid var(--accent)}
.plate{position:relative;display:block;background:var(--paper);overflow:hidden;border-radius:10px}
.plate svg.drawn{display:block;width:100%;height:100%;padding:6%}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.plate.loaded img{opacity:1}.plate.loaded svg.drawn{visibility:hidden}
@media (prefers-reduced-motion:no-preference){.plate img{transition:opacity .4s}}
.hero{display:grid;grid-template-columns:1fr 42%;gap:14px;align-items:start}
.hero figure{margin:0;display:flex;flex-direction:column;gap:6px}
.hero .plate{aspect-ratio:2/3}
.herotext{display:flex;flex-direction:column;gap:10px}
@media (max-width:380px){.hero{grid-template-columns:1fr}.hero .plate{max-width:240px}}
.scale{display:grid;gap:3px}
.scale span{display:flex;flex-direction:column;gap:4px;align-items:center}
.scale i{display:block;width:100%;height:10px;border-radius:3px;background:var(--line)}
.scale span.on i{background:var(--accent)}
.scale b{font-size:.72rem;font-weight:600;color:var(--muted)}
.scale span.on b{color:var(--ink)}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.82rem;border:1px solid var(--line);color:var(--muted)}
.tag.on{background:var(--good-bg);border-color:transparent;color:var(--ink)}
.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.tasting{border-left:5px solid var(--leaf)}
.field{display:flex;flex-direction:column;gap:8px}
.res{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0;padding-top:0}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.swatch.w{background:var(--gold)} .swatch.b{background:var(--accent)}
.stat{display:flex;flex-direction:column;gap:5px}
.stat .row{font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 0;width:100%;text-align:left;min-height:46px}
.check i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.9rem;font-weight:700}
.check[aria-pressed="true"] i{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.check[aria-pressed="true"] span{color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem}
dt{color:var(--muted)} dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:transparent;border:0;border-radius:10px;padding:8px 2px;font-size:.74rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:14px;min-height:92px}
.tile strong{font-family:var(--display);font-size:1.08rem}
.tile span{font-size:.82rem;color:var(--muted)}
.src{font-size:.8rem;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:.86rem;text-align:left;min-height:36px}
textarea{width:100%;min-height:110px;font:inherit;font-size:.82rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.mapwrap{position:relative;overflow:hidden;border-radius:12px;background:var(--line);aspect-ratio:1/1.15;touch-action:none;user-select:none;-webkit-user-select:none}
.map{width:100%;height:100%;display:block;transform-origin:0 0}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.map text.sub{fill:var(--gold);font-style:italic}
.map .dot.soil{fill:var(--leaf)}
.map .reg{fill:var(--accent);fill-opacity:.3;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map .reg.sel{fill-opacity:.6}
.map .reg.q{fill:var(--ink);fill-opacity:.2;stroke:var(--ink)}
.map .reg.bad{fill:var(--bad);stroke:var(--bad);fill-opacity:.55}
.map .hit{fill:transparent;stroke:transparent;stroke-width:14;vector-effect:non-scaling-stroke;pointer-events:all;cursor:pointer}
.map .river{fill:none;stroke:var(--water);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.map .mount{fill:var(--leaf);fill-opacity:.28;stroke:var(--leaf);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.map .par{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:7 5;vector-effect:non-scaling-stroke}
.map .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.map text{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;pointer-events:none}
.map text.rv{fill:var(--water)} .map text.mt{fill:var(--leaf)}
.sec{width:100%;display:block;border-radius:12px;background:var(--bg)}
.sec .land{fill:var(--muted)} .sec .water{fill:var(--water)} .sec .sun{fill:var(--gold)} .sec .vine{stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.sec .ray{stroke:var(--gold);stroke-width:2.5;fill:none} .sec .wind{stroke:var(--water);stroke-width:2.5;fill:none} .sec .rain{stroke:var(--water);stroke-width:1.5}
.sec .cloud{fill:var(--line);stroke:var(--muted)} .sec .ah{fill:var(--ink)}
.sec text{font-family:var(--body);font-size:11px;font-weight:600;fill:var(--ink)} .sec text.on{fill:var(--bg)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const SYM={"-2":"▼▼","-1":"▼","0":"±","1":"▲","2":"▲▲","3":"▲▲▲"};
const sym=r=>r[0]===r[1]?SYM[r[0]]:SYM[r[0]]+" tot "+SYM[r[1]];
const cat=l=>l<0?"weinig":l===0?"gemiddeld":"veel";
const cats=r=>{const s=[];for(let l=r[0];l<=r[1];l++){const c=cat(l);if(!s.includes(c))s.push(c)}return s};
const words=r=>sym(r)+" ("+cats(r).join(" tot ")+")";
const byName=n=>G.find(g=>g.n===n);
const related=(a,b)=>a===b||PARENT[a]===b||PARENT[b]===a||a.includes(b)||b.includes(a);

function wpick(items,keyFn){const w=items.map(i=>1+2*(store.miss[keyFn(i)]||0));let t=w.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<items.length;i++){t-=w[i];if(t<=0)return items[i]}return items[items.length-1]}

function mk(code,topic,key,q,right,wrongs,why){
  wrongs=[...new Set(wrongs)].filter(w=>w!==right);
  if(wrongs.length<2)return null;
  const opts=shuffle([right,...shuffle(wrongs).slice(0,2)]);
  return {code,topic,key,q,opts,a:opts.indexOf(right),why};
}

function inGroup(map,qFn,code){
  const keys=Object.keys(map).filter(k=>map[k].length),k=wpick(keys,k=>"geb:"+k),x=pick(map[k]);
  return mk(code||"4.3","gebieden","geb:"+k,qFn(x),k,Object.keys(map).filter(o=>!map[o].includes(x)),`${x} ligt in ${k}.`);
}

function termQ(){

  return mk(t[2],"termen","term:"+t[0],`Bij welk land of gebied hoort de term ${t[0]}?`,t[1],[...new Set(TERMS.map(x=>x[1]))].filter(a=>!clash.includes(a)),`${t[0]} hoort bij ${t[1]}.`);

const RQ_WEIGHT=["fr","fr","fr","it","it","eu","eu","nw","nw","es","au","at","de","costa"];
function makeQ(topic){
  for(let i=0;i<40;i++){
    const q=topic==="duitsland"?deQ():topic==="druiven"?GQ[pick(Object.keys(GQ))]():topic==="gebieden"?RQ[pick(RQ_WEIGHT)]():termQ();
    if(q){q.src=q.src||srcOf(q);return q}
  }
  return null;
}
function makeQuiz(topics,n){
  const out=[],seen=new Set();
  for(let i=0;i<n*30&&out.length<n;i++){const q=makeQ(pick(topics));if(q&&!seen.has(q.q)){seen.add(q.q);out.push(q)}}
  return out;
}
function tasteQ(){
  for(let i=0;i<40;i++){
    const w=pick(TASTE),g=byName(w[1]);
    const alt=shuffle(TASTE.filter(o=>o[1]!==w[1]&&byName(o[1]).c===g.c));
    const names=[],wr=[];for(const o of alt){if(!names.includes(o[1])){names.push(o[1]);wr.push(o[0])}if(wr.length===2)break}
    if(wr.length<2)continue;
    const opts=shuffle([w[0],...wr]);
    const notes=[["Geur",shuffle(g.ar).slice(0,4).join(", ")],["Zuur",words(g.z)]];
    if(g.t)notes.push(["Tannine",words(g.t)]);
    notes.push(["Smaak",g.body],["Mondgevoel",g.mond.split(" · ")[0]]);
    return {g,notes,opts,a:opts.indexOf(w[0]),c:g.c};
  }
}

  const s=store.stats[q.code]||(store.stats[q.code]={g:0,t:0});s.t++;if(ok)s.g++;

  if(ok){if(m>1)store.miss[q.key]=m-1;else delete store.miss[q.key]}else store.miss[q.key]=m+1;
  save();
}

function newBuild(g){
  const hk=shuffle([...g.h,...shuffle([...new Set(G.flatMap(o=>o.h))].filter(x=>!g.h.some(c=>related(x,c)))).slice(0,Math.max(4,9-g.h.length))]);

  if(id==="mosel")return [open+`<path class="land" d="M0 180V150H112L120 160H190L200 150L330 40L360 36V180Z"/><rect class="water" x="119" y="150" width="72" height="10"/>
    ${vines(214,138,318,50,7)}<circle class="sun" cx="52" cy="38" r="16"/>
    <line class="ray" x1="72" y1="46" x2="246" y2="104" marker-end="url(#ah)"/><line class="ray" stroke-dasharray="5 4" x1="158" y1="148" x2="226" y2="124" marker-end="url(#ah)"/>
    <text x="30" y="72">zon</text><text x="118" y="128">weerkaatsing</text><text x="155" y="175" text-anchor="middle" class="on">Mosel</text>
    <text x="284" y="150" text-anchor="middle" class="on">leisteen houdt</text><text x="284" y="164" text-anchor="middle" class="on">warmte vast</text><text x="200" y="22">steile helling op het zuiden</text></svg>`,
    "Extreem steile hellingen op het zuiden vangen de zon, en de rivier kaatst er licht bij. De leisteen houdt de warmte van overdag vast en geeft de riesling zijn ziltig-minerale karakter."];
  if(id==="rheingau")return [open+`<path class="land" d="M0 180V118Q72 18 150 96L290 150L298 160H352L360 150V180Z"/><rect class="water" x="297" y="150" width="56" height="10"/>
    ${vines(170,96,280,138,7)}<circle class="sun" cx="322" cy="36" r="16"/>
    <line class="ray" x1="308" y1="50" x2="236" y2="108" marker-end="url(#ah)"/><line class="wind" x1="6" y1="34" x2="44" y2="62" marker-end="url(#ah)"/>
    <text x="6" y="22">koude noordenwind</text><text x="72" y="120" text-anchor="middle" class="on">Taunus</text><text x="325" y="175" text-anchor="middle" class="on">Rijn</text>
    <text x="6" y="174" class="on">noord</text><text x="112" y="50">wijngaarden op het zuiden</text></svg>`,
    "De Rijn stroomt hier bij uitzondering van oost naar west. De wijngaarden liggen daardoor op het zuiden, met zicht op de rivier, en de Taunus in hun rug beschut ze tegen de kou."];
  return [open+`<path class="land" d="M0 180V142H56Q130 4 204 122L330 150H360V180Z"/>
    ${vines(214,116,322,140,7)}<circle class="sun" cx="300" cy="38" r="16"/>
    <line class="wind" x1="4" y1="60" x2="62" y2="92" marker-end="url(#ah)"/>
    <text x="4" y="22">koude luchtstromen</text><text x="130" y="128" text-anchor="middle" class="on">Pfälzerwald</text><text x="268" y="88" text-anchor="middle">Pfalz: mild</text><text x="268" y="102" text-anchor="middle">amandel en vijg</text>
    <text x="6" y="174" class="on">west</text></svg>`,
    "De wijngaarden liggen in een strook van zo'n 80 km aan de voet van het Pfälzerwald. Dat houdt koude luchtstromen tegen, waardoor het hier zo mild is dat er amandel- en vijgenbomen groeien."];
}
function vGeo(){
  const D=GEO[geo.land],q=geo.quiz,r=geo.sel&&D.regions.find(x=>x.n===geo.sel),n=D.regions.length;
  const note=geo.noTiles?"De reliëfkaart laadt hier niet. Op GitHub verschijnt hij onder de gebieden.":geo.credit?TILE[geo.prov].credit:"Reliëf laden…";
  const sec=section(geo.sec);
  return `<div class="row between"><h2>Duitsland</h2><span class="muted small">Andere landen volgen</span></div>
  ${q?(q.i<n?`<p class="note"><strong>Tik op: ${h(q.order[q.i])}</strong> <span class="muted">(${q.i+1} van ${n})</span>${q.wrong?`<br>Dat is ${h(q.wrong)}. Probeer het nog eens.`:""}</p>`:`<p class="note"><strong>${q.good} van de ${n} in één keer goed.</strong></p>`):""}
  <div class="mapwrap" id="mapwrap">${mapSVG()}<div class="mapctl"><button data-act="g-plus" aria-label="Inzoomen">+</button><button data-act="g-minus" aria-label="Uitzoomen">−</button><button data-act="g-home" aria-label="Heel Duitsland">⌂</button></div></div>
  <p class="src" id="tilenote">${h(note)} Gebiedsgrenzen bij benadering.</p>
  <p class="muted small">Knijp, scroll of dubbeltik om in te zoomen. Ingezoomd verschijnen de deelgebieden en plaatsen uit het boek.</p>
  <div class="row"><button class="chip" data-act="g-explore" aria-pressed="${!q}">Verkennen</button><button class="chip" data-act="g-quiz" aria-pressed="${!!q}">${q&&q.i>=n?"Opnieuw overhoren":"Overhoor me"}</button></div>
  ${q?"":`${r?`<section class="card"><div class="row between"><h2>${h(r.n)}</h2><button class="chip" data-act="g-zoom">Zoom in</button></div><dl><dt>Druiven</dt><dd>${h(r.druif)}</dd>${r.kleur?`<dt>Aandeel</dt><dd>${h(r.kleur)}</dd>`:""}${r.stijl?`<dt>Wijn</dt><dd>${h(r.stijl)}</dd>`:""}<dt>Wijngaard</dt><dd>${h(r.ha)}</dd></dl><p>${h(r.info)}</p></section>`:`<p class="muted small">Tik op een gebied voor uitleg.</p>`}
  <section class="card"><h3>Wat bepaalt het klimaat?</h3><div class="row">${Object.entries(D.layers).map(([k,l])=>`<button class="chip" data-act="g-layer" data-id="${k}" aria-pressed="${geo.layer===k}">${l[0]}</button>`).join("")}</div>
    ${geo.layer?`<p class="note">${h(D.layers[geo.layer][1])}</p>`:""}</section>
  <section class="card"><h3>Doorsneden</h3><div class="row">${D.sections.map(x=>`<button class="chip" data-act="g-sec" data-id="${x[0]}" aria-pressed="${geo.sec===x[0]}">${x[1]}</button>`).join("")}</div>${sec[0]}<p class="small">${h(sec[1])}</p></section>
  <p class="src">Bron: boek p. 154-163. Het boek toont alle 13 Anbaugebiete, hier staan de 8 uit de SDEN-toetstermen. De doorsneden zijn eigen tekeningen.</p>`}`;
}
function hookTiles(){
  const imgs=[...view.querySelectorAll("svg.map image")];if(!imgs.length)return;
  let bad=0,good=0;const p=geo.prov;
  imgs.forEach(im=>{
    im.addEventListener("load",()=>{good++;if(!geo.credit){geo.credit=true;const el=document.getElementById("tilenote");if(el)el.textContent=TILE[geo.prov].credit+" Gebiedsgrenzen bij benadering."}});
    im.addEventListener("error",()=>{im.remove();bad++;if(bad===imgs.length&&!good&&geo.prov===p&&!geo.noTiles){if(geo.prov+1<TILE.length)geo.prov++;else geo.noTiles=true;geo.credit=false;if(tab==="kaart")render()}});
  });
}

function render(){
  view.innerHTML=tab==="start"?vStart():tab==="overhoren"?vQuiz():tab==="opbouwen"?vBuild():tab==="kaart"?vGeo():vTaste();
  if(tab==="kaart"){hookTiles();hookMap()}
  if(tab==="opbouwen")hookPlates();
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}
function toggle(arr,v){const i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1)}
function top(){try{window.scrollTo(0,0)}catch(e){}}

document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;confirmReset=false;try{location.hash=tab}catch(e){}render();top()});
view.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,d=b.dataset;let scroll=false;
  if(a==="topic")toggle(setup.topics,d.id);
  else if(a==="count")setup.n=+d.n;
  else if(a==="start"||a==="again"){quiz={qs:makeQuiz(setup.topics,setup.n),i:0,pick:null,log:[]};scroll=true}
  else if(a==="answer"){const q=quiz.qs[quiz.i];quiz.pick=+d.i;const ok=quiz.pick===q.a;quiz.log.push({q,pick:quiz.pick,ok});record(q,ok)}
  else if(a==="next"){quiz.i++;quiz.pick=null;quiz.flagged=false;scroll=true}
  else if(a==="stop"){quiz=null;scroll=true}
  else if(a==="grape"){newBuild(byName(d.n));scroll=true}
  else if(a==="gview"){build=null;gview=d.n;scroll=true}
  else if(a==="randgrape"){const todo=G.filter(g=>store.built[g.n]===undefined);newBuild(pick(todo.length?todo:G));scroll=true}
  else if(a==="buildback"){build=null;gview=null;scroll=true}
  else if(a==="b-hk")toggle(build.sel.hk,d.v);
  else if(a==="b-ar")toggle(build.sel.ar,d.v);
  else if(a==="b-syn")toggle(build.sel.syn,d.v);
  else if(a==="b-rijp")build.sel.rijp=d.v;
  else if(a==="b-zuur")build.sel.zuur=d.v;
  else if(a==="b-tann")build.sel.tann=d.v;
  else if(a==="check"){checkBuild();scroll=true}
  else if(a==="t-answer"){taste.pick=+d.i;const s=store.stats["6a.3"]||(store.stats["6a.3"]={g:0,t:0});s.t++;if(taste.pick===taste.q.a)s.g++;save()}
  else if(a==="t-next"){taste=null;scroll=true}
  else if(a==="tasted"){if(store.tasted[d.i])delete store.tasted[d.i];else store.tasted[d.i]=true;save()}
  else if(a==="go"){tab=d.tab;try{location.hash=tab}catch(e){}scroll=true}
  else if(a==="flag"){if(!quiz.flagged){const q=quiz.qs[quiz.i];store.flags.push({q:q.q,a:q.opts[q.a],src:q.src});save();quiz.flagged=true;copied=false}}
  else if(a==="flag-grape"){if(!build.flagged){store.flags.push({q:"Druivenprofiel "+build.g.n,a:"het profiel zoals de app het toont",src:"Boek p. "+build.g.p});save();build.flagged=true;copied=false}}
  else if(a==="copyflags"){try{navigator.clipboard.writeText(flagText()).then(()=>{copied=true;render()}).catch(()=>{const t=document.getElementById("flags");if(t)t.select()})}catch(e){const t=document.getElementById("flags");if(t)t.select()}return}
  else if(a==="clearflags"){store.flags=[];save();copied=false}
  else if(a==="g-region"){if(Date.now()-geo.lastMove<450)return;const q=geo.quiz;if(q&&q.i<q.order.length){const ok=d.n===q.order[q.i];if(ok){record({code:"4.3",key:"kaart:"+d.n},q.first);if(q.first)q.good++;q.i++;q.wrong=null;q.first=true}else{q.wrong=d.n;q.first=false}}else if(!q)geo.sel=d.n}
  else if(a==="g-layer")geo.layer=geo.layer===d.id?null:d.id;
  else if(a==="g-quiz"){geo.quiz={order:shuffle(GEO[geo.land].regions.map(r=>r.n)),i:0,wrong:null,first:true,good:0};geo.c=null;geo.sel=null;scroll=true}
  else if(a==="g-explore")geo.quiz=null;
  else if(a==="g-zoom"){const r=GEO[geo.land].regions.find(x=>x.n===geo.sel);if(r){fitBox(regionBox(r));geo.z=Math.max(geo.z,ZPLACES+.2)}try{document.getElementById("mapwrap").scrollIntoView({block:"start",behavior:"smooth"})}catch(e){}}
  else if(a==="g-home")geo.c=null;
  else if(a==="g-plus"){zoomBy(2);return}
  else if(a==="g-minus"){zoomBy(.5);return}
  else if(a==="g-sec")geo.sec=d.id;
  else if(a==="reset")confirmReset=true;
  else if(a==="reset-no")confirmReset=false;
  else if(a==="reset-yes"){store={stats:{},miss:{},built:{},tasted:{},flags:[]};save();confirmReset=false}
  render();if(scroll)top();
});
load();
const start=(location.hash||"").slice(1);if(["start","overhoren","opbouwen","kaart","proeven"].includes(start))tab=start;
render();
}
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
if(typeof module!=="undefined")module.exports={G,GQ,RQ,termQ,makeQuiz,tasteQ,TASTE,byName,FR,IT,EU,NW};
</script>
